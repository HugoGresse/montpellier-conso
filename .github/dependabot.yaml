version: 2

multi-ecosystem-groups:
  monthly-dependencies:
    schedule:
      interval: monthly

updates:
  - package-ecosystem: bun
    directory: /
    patterns:
      - "*"
    ignore:
      - dependency-name: typescript
        versions:
          - ">=7"
    multi-ecosystem-group: monthly-dependencies

  - package-ecosystem: github-actions
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: monthly-dependencies
